[project]
name = "cairn"
version = "0.1.0"
description = "Cairn goal-based investing API"
authors = [
    { name = "med bm", email = "medbaamrani0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sentry-sdk[fastapi]>=2.73.0",
    "sqlalchemy>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.10,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["cairn"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^api/
      - id: ruff-format
        files: ^api/
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd web && npx prettier --write --ignore-unknown "${@#web/}"' --
        language: system
        files: ^web/

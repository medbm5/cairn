name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: sentry
    attributes:
      label: Sentry issue or request ID
      description: Paste the Sentry issue link, or the X-Request-ID from the response headers.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [API, Web, Explanations (Pebble), Ledger, Deployment]

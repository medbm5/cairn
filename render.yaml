# Render blueprint: the API as a Docker web service plus a managed PostgreSQL database.
# Secrets are marked sync: false, so Render asks for them when the blueprint is applied.
services:
  - type: web
    name: cairn-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    # Migrate, seed the demo once (a no-op when goals exist), then serve.
    dockerCommand: >-
      sh -c "alembic upgrade head
      && python scripts/seed.py --if-empty
      && uvicorn cairn.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cairn-db
          property: connectionString
      - key: CORS_ORIGINS
        # Your Vercel domain plus local development, comma-separated, e.g.
        # https://cairn.vercel.app,http://localhost:5173
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  - name: cairn-db
    plan: free
    databaseName: cairn
    user: cairn

# Render blueprint: the API as a Docker web service plus a managed PostgreSQL database.
# Secrets are marked sync: false, so Render asks for them when the blueprint is applied.
services:
  - type: web
    name: cairn-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    # Migrate, seed the demo once, then serve. Kept in a script because Render
    # passes dockerCommand quotes through literally.
    dockerCommand: sh scripts/start.sh
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cairn-db
          property: connectionString
      - key: CORS_ORIGINS
        # Your Vercel domain plus local development, comma-separated, e.g.
        # https://cairn.vercel.app,http://localhost:5173
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-nano
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  - name: cairn-db
    plan: free
    databaseName: cairn
    user: cairn
